[project]
name = "science-synth-facts"
version = "0.1.0"
description = "Belief implantation experiments: standard truth probing on SDF-finetuned models"
readme = "README.md"
requires-python = ">=3.11"

# Trimmed to what the probing path actually imports. The upstream repo pinned
# ~80 packages (audio, video, gradio, vllm, ...) for the full paper pipeline;
# none of that is needed to extract activations and fit linear probes.
dependencies = [
    "torch>=2.5.1",
    # >=4.57 for Olmo3ForCausalLM; no upper pin, so uv takes the latest anyway.
    "transformers>=4.57.0",
    "accelerate>=1.3.0",
    "peft>=0.14.0",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.27.0",
    "hf-transfer>=0.1.9",
    "datasets>=3.2.0",
    "scikit-learn>=1.6.0",
    "numpy>=1.26",
    "pandas>=2.2.3",
    "scipy>=1.14.1",
    "joblib>=1.4.2",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "fire>=0.7.0",
    "pydantic>=2.10.4",
    "tqdm>=4.66.5",
    "python-dotenv>=1.0.1",
    "requests>=2.32",
    "jsonlines>=4.0.0",
]

[project.optional-dependencies]
# Exporting weights out of Tinker. Kept separate: only needed once, and only on
# whichever machine does the export.
tinker = [
    "tinker",
    "tinker-cookbook",
]
# Only needed if you have to *generate* degree-of-belief eval questions instead
# of downloading the paper's. Pulls in the LLM API stack via safety-tooling.
evals = [
    "anthropic>=0.42.0",
    "openai>=1.58.1",
    "together>=1.2.12",
    "jinja2>=3.1.4",
    "pyyaml>=6.0",
    "tenacity>=8.5.0",
]
dev = [
    "ipykernel>=6.29.5",
    "ruff>=0.8.3",
]

# The H100 box's driver tops out at CUDA 12.8 (reports 12080). PyPI's default
# torch wheel is built against a newer CUDA, so it imports fine but silently
# reports torch.cuda.is_available() == False and everything falls back to CPU.
# Pin torch to the cu128 index on Linux; macOS still resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# find_namespace, not find: several subpackages (evaluations/, model_internals/
# datasets/, finetuning/) ship without __init__.py.
[tool.setuptools.packages.find]
where = ["."]
include = ["science_synth_facts*"]
namespaces = true

[tool.ruff]
ignore = [
    "E501",  # Line too long
    "F401",  # Unused import
    "F841",  # Unused variable
    "E402",  # Module level import not at top of file
]
